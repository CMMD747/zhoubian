<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>周边洞察</title>
    <style>
        /* ========== 全局样式（蓝白配色） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #E3F2FD 0%, #F5F9FF 40%, #FFFFFF 100%);
            min-height: 100vh;
            color: #212121;
            padding: 16px;
            padding-bottom: 40px;
        }

        /* ========== 标题 ========== */
        .app-header {
            text-align: center;
            padding: 20px 0 16px;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1565C0;
            letter-spacing: 2px;
        }
        .app-header .subtitle {
            font-size: 13px;
            color: #64B5F6;
            margin-top: 4px;
        }

        /* ========== 定位信息卡片 ========== */
        .location-card {
            background: #FFFFFF;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(30, 136, 229, 0.08);
            border-left: 4px solid #1E88E5;
        }
        .location-card .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #1565C0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .location-card .card-title::before {
            content: "📍";
            font-size: 16px;
        }
        .location-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 13px;
            border-bottom: 1px solid #F0F4F8;
        }
        .location-row:last-child {
            border-bottom: none;
        }
        .location-row .label {
            color: #757575;
            flex-shrink: 0;
            width: 60px;
        }
        .location-row .value {
            color: #212121;
            text-align: right;
            word-break: break-all;
            flex: 1;
            margin-left: 10px;
        }
        .location-loading {
            color: #90A4AE;
            font-size: 13px;
            text-align: center;
            padding: 10px 0;
        }

        .location-addr {
            font-size: 16px;
            font-weight: 600;
            color: #1565C0;
            line-height: 1.6;
            word-break: break-all;
            padding: 6px 0 2px;
        }

        /* ========== 操作按钮 ========== */
        .action-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1E88E5 0%, #1565C0 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(30, 136, 229, 0.3);
            margin-bottom: 16px;
        }
        .action-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(30, 136, 229, 0.2);
        }
        .action-btn:disabled {
            background: #BDBDBD;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ========== 加载动画 ========== */
        .loading-container {
            display: none;
            text-align: center;
            padding: 24px 0;
        }
        .loading-container.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E3F2FD;
            border-top: 4px solid #1E88E5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 14px;
            color: #1565C0;
        }
        .loading-progress {
            font-size: 12px;
            color: #90A4AE;
            margin-top: 6px;
        }

        /* ========== 报告区域 ========== */
        .report-container {
            display: none;
            background: #FFFFFF;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(30, 136, 229, 0.08);
            margin-bottom: 16px;
        }
        .report-container.active {
            display: block;
        }
        .report-title {
            font-size: 15px;
            font-weight: 600;
            color: #1565C0;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #E3F2FD;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .report-title::before {
            content: "📊";
        }
        .report-content {
            font-size: 14px;
            line-height: 1.8;
            color: #424242;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .report-content p {
            margin-bottom: 10px;
        }

        /* ========== 左上角悬浮调试设置入口 ========== */
        .dev-float-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #E3F2FD;
            box-shadow: 0 2px 8px rgba(21, 101, 192, 0.18);
            color: #1565C0;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .dev-float-btn:active {
            transform: scale(0.92);
            background: #E3F2FD;
        }

        /* ========== 底部声明 ========== */
        .app-footer {
            text-align: center;
            font-size: 11px;
            color: #B0BEC5;
            padding: 12px 0;
        }
    </style>
</head>
<body>

    <!-- 左上角常驻调试设置入口 -->
    <button class="dev-float-btn" id="devEntry" onclick="openDevSettings()" title="开发者设置">⚙</button>

    <!-- 标题 -->
    <div class="app-header">
        <h1>周边洞察</h1>
        <div class="subtitle">AI 驱动的周边信息分析</div>
    </div>

    <!-- 定位信息卡片 -->
    <div class="location-card" id="locationCard">
        <div class="card-title">当前定位</div>
        <div class="location-loading" id="locationLoading">正在获取定位信息…</div>
        <div id="locationDetails" style="display:none;">
            <div class="location-addr" id="addrValue">-</div>
        </div>
    </div>

    <!-- 生成报告按钮 -->
    <button class="action-btn" id="generateBtn" onclick="generateReport()">生成周边分析报告</button>

    <!-- 加载动画 -->
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">正在分析周边信息…</div>
        <div class="loading-progress" id="loadingProgress"></div>
    </div>

    <!-- 报告显示区域 -->
    <div class="report-container" id="reportContainer">
        <div class="report-title">周边分析报告</div>
        <div class="report-content" id="reportContent"></div>
    </div>

    <!-- 底部声明 -->
    <div class="app-footer">数据仅供参考 · <a href="privacy.html" style="color:#B0BEC5;text-decoration:underline;">隐私政策</a></div>

    <!-- 业务逻辑脚本 -->
    <script src="app.js"></script>
</body>
</html>
