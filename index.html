<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>源 · 旧版已停用</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
       background:#0f1115;color:#e8eaed;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .card{width:100%;max-width:340px;text-align:center;background:#171a21;border:1px solid #232833;
        border-radius:18px;padding:30px 22px}
  .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#1565C0,#1E88E5);
        color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
  h1{font-size:19px;letter-spacing:1px;margin-bottom:10px}
  p{font-size:13.5px;line-height:1.8;color:#9aa2b1;margin-bottom:22px}
  button{width:100%;padding:13px 0;border:0;border-radius:24px;font-size:15px;font-weight:700;color:#fff;
         background:linear-gradient(90deg,#1565C0,#1E88E5);cursor:pointer}
  .ver{margin-top:12px;font-size:12px;color:#6b7280}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">源</div>
    <h1>旧版已停用</h1>
    <p>为提供更完整的服务，此版本已停止使用。<br>请下载最新版继续使用。</p>
    <button id="dl" onclick="go()">⬇ 下载最新版</button>
    <div class="ver" id="ver">正在获取最新版本信息…</div>
  </div>
<script>
  var APK = 'https://cmmd747.github.io/zhoubian/apk/yuan_v2.1.21.apk';
  function go() { location.href = APK; }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', 'https://cmmd747.github.io/zhoubian/yuan_version.json?t=' + Date.now(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      try {
        var j = JSON.parse(x.responseText);
        if (j && j.apkUrl) APK = j.apkUrl;
        document.getElementById('ver').textContent =
          '最新版 v' + (j.versionName || '') + (j.fileSize ? ' · ' + j.fileSize : '');
      } catch (e) {}
    };
    x.send();
  } catch (e) {}
</script>
</body>
</html>
