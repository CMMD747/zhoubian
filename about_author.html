<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>长篇小说 · 小源</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body.mask-open { position:fixed; left:0; right:0; width:100%; overflow:hidden; }
  body { font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif; background:#1e1c1a; color:#c9c2b4; line-height:1.9; padding:28px 20px 60px; max-width:640px; margin:0 auto; }
  h1 { text-align:center; font-size:24px; color:#e8e0d2; letter-spacing:8px; margin:34px 0 10px; font-weight:600; }
  .subtitle { text-align:center; color:#8a7d6a; font-size:13px; letter-spacing:2px; margin-bottom:24px; border-bottom:1px solid #3a352f; padding-bottom:20px; }
  .intro { border-left:3px solid #a8906c; padding:12px 16px; margin:6px 12px 22px; color:#b3a48e; font-size:15px; background:rgba(168,144,108,0.06); line-height:1.8; }
  .status { text-align:center; color:#7d7160; font-size:13px; letter-spacing:1px; margin:14px 0 18px; }
  .btn-row { text-align:center; margin:14px 0 4px; }
  .btn-primary { display:inline-block; background:#a8906c; color:#1e1c1a; border:none; border-radius:22px; padding:11px 34px; font-size:15px; letter-spacing:3px; margin:6px 6px; cursor:pointer; }
  .btn-primary.ghost { background:transparent; color:#a8906c; border:1px solid #a8906c; }
  /* 目录 */
  .toc { margin-top:26px; }
  .toc-title { text-align:center; color:#a8906c; font-size:17px; letter-spacing:6px; margin:8px 0 14px; }
  .vol { border-bottom:1px solid #302b25; }
  .vol-head { display:flex; justify-content:space-between; align-items:center; padding:13px 4px; color:#c9b896; font-size:16px; letter-spacing:2px; cursor:pointer; }
  .vol-head .arrow { color:#7d7160; font-size:12px; transition:transform .2s; }
  .vol.open .arrow { transform:rotate(90deg); }
  .vol-chaps { display:none; padding:0 4px 10px 18px; }
  .vol.open .vol-chaps { display:block; }
  .chap { display:block; padding:8px 4px; color:#9c917f; font-size:15px; letter-spacing:1px; border-bottom:1px dashed #2a2620; cursor:pointer; }
  .chap:active { color:#e8e0d2; }
  .chap .n { color:#7d7160; margin-right:6px; }
  .toc-end { text-align:center; color:#7d7160; font-size:14px; letter-spacing:6px; padding:20px 0 8px; }
  /* 阅读页 */
  #reader { display:none; }
  .reader-top { display:flex; justify-content:space-between; align-items:center; padding:10px 2px 12px; border-bottom:1px solid #3a352f; position:sticky; top:0; background:#1e1c1a; z-index:5; }
  .reader-title { color:#a8906c; font-size:14px; letter-spacing:2px; max-width:55%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav-btn { color:#c9a86a; font-size:14px; letter-spacing:2px; padding:6px 10px; cursor:pointer; border:1px solid #3a352f; border-radius:6px; background:#24211d; }
  .nav-btn:active { background:#332e27; }
  .font-btns { display:flex; gap:4px; }
  .font-btns .nav-btn { padding:6px 8px; letter-spacing:0; font-size:13px; }
  #readerContent { padding-top:20px; min-height:70vh; }
  #readerContent h3 { text-align:center; font-size:17px; color:#c9b896; letter-spacing:3px; margin:10px 0 24px; font-weight:600; }
  #readerContent p { text-indent:2em; margin-bottom:16px; font-size:16px; text-align:justify; }
  .reader-bottom { display:flex; justify-content:space-between; margin-top:30px; padding-top:18px; border-top:1px solid #3a352f; }
  .reader-bottom .nav-btn { padding:10px 22px; }
  .nav-btn.disabled { opacity:.3; pointer-events:none; }
  .contact { text-align:center; margin-top:44px; padding-top:20px; border-top:1px solid #3a352f; }
  .contact p { text-indent:0; margin-bottom:6px; color:#a8906c; font-size:15px; letter-spacing:3px; }
  .contact a { color:#c9a86a; text-decoration:none; border-bottom:1px dashed #a8906c; }
  .end { text-align:center; color:#8a7d6a; font-size:14px; margin-top:40px; letter-spacing:8px; }

  /* ===== 段评 ===== */
  #readerContent p { position: relative; }
  .pcnt { display:inline-block; margin-left:8px; font-size:11.5px; color:#c9a86a; border:1px solid #4a4238; border-radius:10px; padding:1px 8px; vertical-align:middle; white-space:nowrap; opacity:.9; }
  #pcMask { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:60; display:none; align-items:flex-end; justify-content:center; }
  #pcMask.show { display:flex; }
  #pcSheet { width:100%; max-width:640px; max-height:74vh; background:#26231f; border-top-left-radius:16px; border-top-right-radius:16px; display:flex; flex-direction:column; }
  .pc-head { padding:13px 16px; border-bottom:1px solid #3a352f; color:#c9b896; font-size:14.5px; letter-spacing:2px; display:flex; justify-content:space-between; align-items:center; }
  .pc-head .x { color:#8a7d6a; padding:2px 8px; cursor:pointer; }
  .pc-quote { padding:10px 16px; color:#8a7d6a; font-size:13px; line-height:1.7; border-bottom:1px solid #302b25; max-height:76px; overflow:auto; }
  .pc-list { flex:1; overflow-y:auto; padding:4px 16px 10px; }
  .pc-item { padding:11px 0; border-bottom:1px dashed #302b25; }
  .pc-item .who { color:#c9a86a; font-size:12.5px; margin-bottom:3px; }
  .pc-item .txt { color:#d8d0c2; font-size:14.5px; line-height:1.7; word-break:break-word; }
  .pc-item .tm { color:#6f6557; font-size:11px; margin-top:4px; }
  .pc-empty { text-align:center; color:#7d7160; font-size:13px; padding:28px 0; }
  .pc-input { display:flex; gap:8px; padding:10px 12px; border-top:1px solid #3a352f; }
  .pc-input input { flex:1; background:#1e1c1a; border:1px solid #3a352f; color:#d8d0c2; border-radius:9px; padding:10px 12px; font-size:14.5px; }
  .pc-input button { background:#a8906c; color:#1e1c1a; border:none; border-radius:9px; padding:0 20px; font-size:14.5px; }
  /* ===== 账号 ===== */
  #accChip { position:fixed; top:12px; right:12px; z-index:20; display:flex; align-items:center; gap:6px; background:#26231f; border:1px solid #3a352f; border-radius:20px; padding:5px 12px 5px 6px; color:#c9b896; font-size:12.5px; letter-spacing:1px; cursor:pointer; max-width:46vw; }
  #accChip .acc-av { font-size:17px; }
  .acc-badge { background:#c0392b; color:#fff; font-size:10.5px; line-height:1; border-radius:9px; padding:3px 6px; margin-right:5px; }
  .acc-h2 { color:#8a7d6a; font-size:12px; letter-spacing:2px; margin:2px 0 8px; }
  .noti-list { max-height:30vh; overflow:auto; margin-bottom:14px; border:1px solid #302b25; border-radius:10px; }
  .noti-empty { text-align:center; color:#7d7160; font-size:13px; padding:18px 0; }
  .noti-item { padding:9px 12px; border-bottom:1px dashed #302b25; cursor:pointer; }
  .noti-item:last-child { border-bottom:none; }
  .noti-item.unread { background:rgba(168,144,108,.08); }
  .noti-top { display:flex; justify-content:space-between; align-items:center; }
  .noti-from { color:#c9a86a; font-size:12.5px; }
  .noti-tm { color:#6f6557; font-size:11px; }
  .noti-x { color:#d8d0c2; font-size:13.5px; line-height:1.6; margin-top:2px; word-break:break-word; }
  .noti-ctx { color:#6f6557; font-size:11px; margin-top:3px; }
  #accMask { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:70; display:none; align-items:center; justify-content:center; }
  #accMask.show { display:flex; }
  #accSheet { width:88%; max-width:420px; background:#26231f; border-radius:16px; padding:18px 18px 16px; }
  .acc-h { color:#c9b896; font-size:15px; letter-spacing:2px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .acc-h .x { color:#8a7d6a; cursor:pointer; }
  #accGrid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
  #accGrid .av { text-align:center; font-size:22px; padding:6px 0; border:1px solid transparent; border-radius:10px; cursor:pointer; }
  #accGrid .av.on { border-color:#a8906c; background:rgba(168,144,108,.12); }
  #accNick { width:100%; background:#1e1c1a; border:1px solid #3a352f; color:#d8d0c2; border-radius:9px; padding:10px 12px; font-size:14.5px; margin-bottom:12px; }
  #accSave { width:100%; background:#a8906c; color:#1e1c1a; border:none; border-radius:9px; padding:11px; font-size:15px; letter-spacing:3px; }
  /* ===== 段评增强 ===== */
  .pc-item { display:flex; gap:9px; }
  .pc-av { width:30px; height:30px; line-height:26px; text-align:center; flex:0 0 auto; font-size:17px; border:2px solid #4a4238; border-radius:50%; background:#201d1a; }
  .pc-body { flex:1; min-width:0; }
  .pc-act { display:flex; gap:14px; align-items:center; margin-top:5px; }
  .pc-act .pc-like, .pc-act .pc-re { color:#8a7d6a; font-size:12px; cursor:pointer; }
  .pc-act .pc-like.on { color:#c9a86a; }
  .pc-act .pc-del { color:#8a7d6a; font-size:12px; cursor:pointer; }
  .pc-act .pc-del.arm { color:#e07a5f; font-weight:600; }
  .pc-act .tm { color:#6f6557; font-size:11px; margin:0; }
  .pc-me { color:#7d7160; font-size:10.5px; border:1px solid #4a4238; border-radius:8px; padding:0 5px; }
  .pc-reply { margin-top:8px; padding-left:10px; border-left:2px solid #3a352f; border-bottom:none; }
  #pcReplyHint { display:none; padding:7px 16px; color:#8a7d6a; font-size:12.5px; border-top:1px solid #302b25; }
  #pcReplyHint span { color:#c9a86a; cursor:pointer; }
  /* ===== 页内提示（替代 alert，避免暴露来源域名） ===== */
  #xyToast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96); background:rgba(22,20,18,.95); color:#e8e0d2; border:1px solid #4a4238; border-radius:10px; padding:12px 20px; font-size:14px; letter-spacing:1px; z-index:99; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; max-width:72vw; text-align:center; line-height:1.6; }
  #xyToast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
</style>
</head>
<body>

<!-- 书籍首页 -->
<div id="bookHome">
  <h1>小源</h1>
  <div class="subtitle">长篇小说 · 回忆录体（1885—1980）</div>
  <div class="intro">《小源》是一部回忆录体长篇小说。主人公小源，生于光绪十一年（1885年）八月初二，河南扶沟县刘家村人，卒于1980年腊月二十三，享年九十五岁。全书以第一人称，从出生写到临终，横跨晚清、民国、抗战与新中国。记的是一块土地、几亩庄稼、一家人的吃饭穿衣，和一个农民一辈子的盼与等。</div>
  <div id="status" class="status">正在从云端加载正文…</div>
  <div class="btn-row">
    <button id="btnContinue" class="btn-primary" style="display:none">继续阅读</button>
    <button id="btnStart" class="btn-primary ghost">从头阅读</button>
  </div>
  <div class="toc">
    <div class="toc-title">目 录</div>
    <div id="tocList"></div>
  </div>
  <div class="contact">
    <p>联系我们</p>
    <p>作者 QQ：<a href="mqq://card/show_pslcard?src_type=internal&version=1&uin=445256409">445256409</a></p>
  </div>
</div>

<!-- 阅读页 -->
<div id="reader">
  <div class="reader-top">
    <span id="btnBack" class="nav-btn">目录</span>
    <span id="readerTitle" class="reader-title"></span>
    <span class="font-btns">
      <span id="btnFontMinus" class="nav-btn">A−</span>
      <span id="btnFontPlus" class="nav-btn">A＋</span>
    </span>
  </div>
  <div id="readerContent"></div>
  <div class="reader-bottom">
    <span id="btnPrev" class="nav-btn">上一章</span>
    <span id="btnNext" class="nav-btn">下一章</span>
  </div>
</div>

<!-- ===== 账号入口 ===== -->
<div id="accChip" title="我的"><span class="acc-av">🐟</span>设置昵称</div>

<!-- ===== 账号面板 ===== -->
<div id="accMask">
  <div id="accSheet">
    <div class="acc-h"><span>消息 · 账号</span><span class="x" id="accClose">关闭</span></div>
    <div class="acc-h2">回复我的</div>
    <div id="notiList" class="noti-list"></div>
    <div class="acc-h2">我的身份</div>
    <div id="accGrid"></div>
    <input id="accNick" type="text" maxlength="16" placeholder="起个昵称（最多16字）">
    <button id="accSave">保存</button>
  </div>
</div>

<!-- ===== 段评面板 ===== -->
<div id="pcMask">
  <div id="pcSheet">
    <div class="pc-head"><span>段 评</span><span class="x" id="pcClose">关闭</span></div>
    <div class="pc-quote" id="pcQuote"></div>
    <div class="pc-list" id="pcList"></div>
    <div id="pcReplyHint"></div>
    <div class="pc-input">
      <input id="pcText" type="text" maxlength="200" placeholder="说点什么…">
      <button id="pcSend">发送</button>
    </div>
  </div>
</div>

<script>
(function(){
  var BASE = 'https://cmmd747.github.io/zhoubian/novel/';
  var FILES = ['楔子','第一卷','第二卷','第三卷','第四卷','第五卷','第六卷','第七卷','第八卷','尾声'];
  var CACHE_PREFIX = 'novel_xiaoyuan_v2_';
  var POS_KEY = 'xy_read_pos';
  var FONT_KEY = 'xy_font_size';

  var novelEl = document.getElementById('bookHome');
  var readerEl = document.getElementById('reader');
  var statusEl = document.getElementById('status');
  var tocListEl = document.getElementById('tocList');
  var btnContinue = document.getElementById('btnContinue');
  var btnStart = document.getElementById('btnStart');

  // NOVEL: [{file, title, chapters:[{title, paras:[]}]}]
  var NOVEL = [];
  // flat: [{vi, ci, title}]
  var FLAT = [];
  var curIdx = -1;

  function esc(s){ var A=String.fromCharCode(38); return s.replace(/&/g,A+'amp;').replace(/</g,A+'lt;').replace(/>/g,A+'gt;').replace(/"/g,A+'quot;'); }

  /* 页内提示气泡（不弹原生框，不显示页面网址） */
  var xyToastTimer = null;
  function toast(msg){
    var el = document.getElementById('xyToast');
    if (!el){ el = document.createElement('div'); el.id = 'xyToast'; document.body.appendChild(el); }
    el.textContent = String(msg == null ? '' : msg);
    el.classList.add('show');
    if (xyToastTimer) clearTimeout(xyToastTimer);
    xyToastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1900);
  }
  /* 弹层打开时锁住背景滚动（避免下层目录被拖动） */
  var _lockY = 0;
  function lockScroll(on){
    try {
      var b = document.body;
      if (on){
        if (b.classList.contains('mask-open')) return;
        _lockY = window.scrollY || window.pageYOffset || 0;
        b.style.top = '-' + _lockY + 'px';
        b.classList.add('mask-open');
      } else {
        if (!b.classList.contains('mask-open')) return;
        b.classList.remove('mask-open');
        b.style.top = '';
        window.scrollTo(0, _lockY);
      }
    } catch(e){}
  }

  function parseVol(file, text){
    var lines = text.split(/\r?\n/);
    var volTitle = lines.length ? lines[0].trim() : file;
    var chapters = [];
    var cur = null;
    for (var i = 1; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;
      if (/^第[一二三四五六七八九十百零\d]+章/.test(line)){
        cur = { title: line, paras: [] };
        chapters.push(cur);
      } else {
        if (!cur){ cur = { title: volTitle, paras: [] }; chapters.push(cur); }
        cur.paras.push(line);
      }
    }
    if (chapters.length === 0){ chapters.push({ title: volTitle, paras: [] }); }
    return { file: file, title: volTitle, chapters: chapters };
  }

  function buildFlat(){
    FLAT = [];
    for (var vi = 0; vi < NOVEL.length; vi++){
      for (var ci = 0; ci < NOVEL[vi].chapters.length; ci++){
        FLAT.push({ vi: vi, ci: ci, title: NOVEL[vi].chapters[ci].title });
      }
    }
  }

  function renderToc(){
    var html = '';
    for (var vi = 0; vi < NOVEL.length; vi++){
      var vol = NOVEL[vi];
      var open = vi === 0 ? ' open' : '';
      html += '<div class="vol' + open + '" data-vi="' + vi + '">';
      html += '<div class="vol-head">' + esc(vol.title) + '<span class="arrow">▶</span></div>';
      html += '<div class="vol-chaps">';
      for (var ci = 0; ci < vol.chapters.length; ci++){
        html += '<span class="chap" data-vi="' + vi + '" data-ci="' + ci + '"><span class="n">' + (ci + 1) + '.</span>' + esc(vol.chapters[ci].title) + '</span>';
      }
      html += '</div></div>';
    }
    html += '<div class="toc-end">—— 未完待续 ——</div>';
    tocListEl.innerHTML = html;

    // 卷折叠
    var heads = tocListEl.querySelectorAll('.vol-head');
    for (var i = 0; i < heads.length; i++){
      heads[i].addEventListener('click', function(){
        var v = this.parentNode;
        v.classList.toggle('open');
      });
    }
    // 章节点击
    var chaps = tocListEl.querySelectorAll('.chap');
    for (var j = 0; j < chaps.length; j++){
      chaps[j].addEventListener('click', function(){
        var vi = parseInt(this.getAttribute('data-vi'), 10);
        var ci = parseInt(this.getAttribute('data-ci'), 10);
        goChapter(vi, ci);
      });
    }
  }

  function flatIndexOf(vi, ci){
    for (var i = 0; i < FLAT.length; i++){
      if (FLAT[i].vi === vi && FLAT[i].ci === ci) return i;
    }
    return -1;
  }

  function renderChapter(){
    var f = FLAT[curIdx];
    var chap = NOVEL[f.vi].chapters[f.ci];
    var fs = parseInt(localStorage.getItem(FONT_KEY) || '16', 10);
    var html = '<h3>' + esc(chap.title) + '</h3>';
    for (var i = 0; i < chap.paras.length; i++){
      html += '<p data-p="' + i + '">' + esc(chap.paras[i]) + '<span class="pcnt">评论</span></p>';
    }
    document.getElementById('readerContent').innerHTML = html;
    document.getElementById('readerContent').style.fontSize = fs + 'px';
    var ps = document.getElementById('readerContent').querySelectorAll('p');
    for (var k = 0; k < ps.length; k++){ ps[k].style.fontSize = fs + 'px'; }
    for (var q = 0; q < ps.length; q++){
      ps[q].addEventListener('click', function(){ openPc(parseInt(this.getAttribute('data-p'), 10)); });
    }
    var fpc = FLAT[curIdx];
    fetchPc(fpc.vi, fpc.ci).then(function(){ if (curIdx === flatIndexOf(fpc.vi, fpc.ci)) applyBadges(); });
    document.getElementById('readerTitle').textContent = NOVEL[f.vi].title;
    document.getElementById('btnPrev').classList.toggle('disabled', curIdx <= 0);
    document.getElementById('btnNext').classList.toggle('disabled', curIdx >= FLAT.length - 1);
    try { localStorage.setItem(POS_KEY, JSON.stringify({ vi: f.vi, ci: f.ci })); } catch(e){}
    window.scrollTo(0, 0);
  }

  function goChapter(vi, ci){
    var idx = flatIndexOf(vi, ci);
    if (idx < 0) return;
    curIdx = idx;
    novelEl.style.display = 'none';
    readerEl.style.display = 'block';
    renderChapter();
  }

  function backToHome(){
    readerEl.style.display = 'none';
    novelEl.style.display = 'block';
    // 更新继续阅读按钮
    updateContinue();
    window.scrollTo(0, 0);
  }

  function updateContinue(){
    var pos = null;
    try { pos = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch(e){}
    if (pos){
      var idx = flatIndexOf(pos.vi, pos.ci);
      if (idx >= 0){
        btnContinue.style.display = 'inline-block';
        btnContinue.textContent = '继续阅读：' + FLAT[idx].title;
      } else {
        btnContinue.style.display = 'none';
      }
    } else {
      btnContinue.style.display = 'none';
    }
  }

  // 事件绑定
  btnContinue.addEventListener('click', function(){
    var pos = null;
    try { pos = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch(e){}
    if (pos) goChapter(pos.vi, pos.ci);
  });
  btnStart.addEventListener('click', function(){ if (FLAT.length) goChapter(FLAT[0].vi, FLAT[0].ci); });
  document.getElementById('btnBack').addEventListener('click', backToHome);
  document.getElementById('btnPrev').addEventListener('click', function(){
    if (curIdx > 0){ curIdx--; renderChapter(); }
  });
  document.getElementById('btnNext').addEventListener('click', function(){
    if (curIdx < FLAT.length - 1){ curIdx++; renderChapter(); }
  });
  document.getElementById('btnFontMinus').addEventListener('click', function(){
    var fs = parseInt(localStorage.getItem(FONT_KEY) || '16', 10);
    fs = Math.max(13, fs - 1);
    localStorage.setItem(FONT_KEY, String(fs));
    renderChapter();
  });
  document.getElementById('btnFontPlus').addEventListener('click', function(){
    var fs = parseInt(localStorage.getItem(FONT_KEY) || '16', 10);
    fs = Math.min(24, fs + 1);
    localStorage.setItem(FONT_KEY, String(fs));
    renderChapter();
  });

  // 数据加载
  function fetchT(url, ms){
    return new Promise(function(res, rej){
      var done = false;
      var t = setTimeout(function(){ if(!done){ done = true; rej(new Error('timeout')); } }, ms);
      fetch(url, { cache: 'no-store' }).then(
        function(r){ if(!done){ done = true; clearTimeout(t); res(r); } },
        function(e){ if(!done){ done = true; clearTimeout(t); rej(e); } }
      );
    });
  }

  function loadOne(name){
    return fetchT(BASE + encodeURIComponent(name) + '.txt', 10000)
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(t){
        try { localStorage.setItem(CACHE_PREFIX + name, t); } catch(e){}
        return { name: name, text: t, fromCache: false };
      })
      .catch(function(){
        var c = null;
        try { c = localStorage.getItem(CACHE_PREFIX + name); } catch(e){}
        if (c) return { name: name, text: c, fromCache: true };
        return null;
      });
  }

  var jobs = FILES.map(loadOne);
  Promise.all(jobs).then(function(results){
    var ok = results.filter(function(r){ return r; });
    var anyCache = ok.some(function(r){ return r.fromCache; });
    if (ok.length === FILES.length){
      statusEl.textContent = anyCache ? '正文来自本地缓存（离线模式）' : '正文来自云端';
    } else if (ok.length > 0){
      statusEl.textContent = anyCache ? '已加载部分正文（含本地缓存）' : '已加载已发布卷（其余卷尚未发布）';
    } else {
      statusEl.textContent = '云端正文暂时不可用，且无本地缓存。请联网后打开本页。';
      return;
    }
    if (ok.length === 0){
      statusEl.textContent = '云端正文暂时不可用，且无本地缓存。请联网后打开本页。';
      return;
    }
    NOVEL = [];
    for (var i = 0; i < FILES.length; i++){
      var r = results[i];
      if (r) NOVEL.push(parseVol(r.name, r.text));
    }
    buildFlat();
    renderToc();
    updateContinue();
    if (NOVEL.length === 0){ statusEl.textContent = '正文加载失败。'; }
  });

  /* ============ 身份 / 账号 ============ */
  var API = 'https://yuan-users.pages.dev';
  var PC_API = API + '/pc';
  var ACC_API = API + '/acc';
  var AVATARS = ['🐟','🌾','🌙','🌿','🔥','🍵','🏮','⛰️','🐎','🌊','🕊️','🌰','🪶','🎋','🐓','🥟','🧧','🌻','🐦','🍂','🪷','☁️','⭐','🧵'];
  var MY = { u: '', n: '', a: '' };
  var NOTI = { unread: 0, seen: 0, list: [] };
  var pcCache = {};
  var pcCur = null;
  var pcReplyTo = '';
  var pcDelArm = '', pcDelTimer = null;
  function uuidAnon(){
    var u = null;
    try { u = localStorage.getItem('xy_uid'); } catch(e){}
    if (!u){ u = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); try { localStorage.setItem('xy_uid', u); } catch(e){} }
    return u;
  }
  function fpFromUrl(){ try { var m = location.search.match(/[?&]fp=([0-9a-zA-Z_-]{8,64})/); return m ? m[1] : ''; } catch(e){ return ''; } }
  function initIdentity(){
    MY.u = fpFromUrl() || uuidAnon();
    try { MY.n = localStorage.getItem('xy_name') || ''; MY.a = localStorage.getItem('xy_av') || ''; } catch(e){}
  }
  function saveLocal(){ try { localStorage.setItem('xy_name', MY.n||''); localStorage.setItem('xy_av', MY.a||''); } catch(e){} }
  function displayName(){
    var A = ['风','云','星','月','夜','雨','雪','林','山','灯','茶','喵','鹿','鲸','梅','松'];
    var B = ['落','尘','光','影','声','色','听','语','见','眠','归','行','生','夏'];
    return A[Math.floor(Math.random()*A.length)] + B[Math.floor(Math.random()*B.length)] + String(Math.floor(Math.random()*90+10));
  }
  function avatarIdx(v){ var i = parseInt((v===undefined||v===null||v==='')?MY.a:v, 10); if (isNaN(i)||i<0||i>=AVATARS.length) i = 0; return i; }
  function avatarOf(o){ return AVATARS[avatarIdx(o && o.a)]; }
  function uidHue(id){ var h = 0, s = String(id || ''); for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h % 360; }
  function ringOf(o){ return 'hsl(' + uidHue((o && o.uid) || (o && o.n) || '') + ',52%,56%)'; }
  function updateAccChip(){
    var chip = document.getElementById('accChip'); if (!chip) return;
    var b = NOTI.unread > 0 ? '<span class="acc-badge">' + (NOTI.unread > 99 ? '99+' : NOTI.unread) + '</span>' : '';
    chip.innerHTML = b + '<span class="acc-av">' + avatarOf({a:MY.a}) + '</span>' + (MY.n ? esc(MY.n) : '设置昵称');
  }
  function renderNoti(){
    var el = document.getElementById('notiList'); if (!el) return;
    var list = NOTI.list || [];
    if (!list.length){ el.innerHTML = '<div class="noti-empty">还没有人回复你</div>'; return; }
    var h = '';
    for (var i = 0; i < list.length; i++){
      var it = list[i];
      h += '<div class="noti-item' + ((it.t || 0) > (NOTI.seen || 0) ? ' unread' : '') + '" data-i="' + i + '">'
        + '<div class="noti-top"><span class="noti-from">' + esc(it.from || '读者') + '</span><span class="noti-tm">' + fmtTime(it.t || 0) + '</span></div>'
        + '<div class="noti-x">' + esc(it.x || '') + '</div>'
        + '<div class="noti-ctx">' + esc((it.f || '') + ' · 第' + ((it.p | 0) + 1) + '段') + '</div></div>';
    }
    el.innerHTML = h;
  }
  function loadNoti(){
    if (!MY.u) return;
    fetch(API + '/noti?u=' + encodeURIComponent(MY.u), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.ok){ NOTI.unread = d.unread | 0; NOTI.seen = d.seen || 0; NOTI.list = d.list || []; updateAccChip(); renderNoti(); } })
      .catch(function(){});
  }
  function markNotiRead(){
    if (!MY.u || !(NOTI.unread > 0)) return;
    NOTI.unread = 0; updateAccChip(); renderNoti();
    fetch(API + '/noti?w=1&read=1&u=' + encodeURIComponent(MY.u), { cache:'no-store' }).catch(function(){});
  }
  function gotoNoti(it){
    if (!it) return;
    closeAcc();
    var vi = -1;
    for (var i = 0; i < FILES.length; i++){ if (FILES[i] === it.f) { vi = i; break; } }
    if (vi < 0){ toast('找不到该章节'); return; }
    var ci = parseInt(it.c, 10);
    if (isNaN(ci)){ toast('找不到该章节'); return; }
    goChapter(vi, ci);
    fetchPc(vi, ci).then(function(){ openPc(parseInt(it.p, 10) || 0); });
  }
  function bindNotiList(){
    var el = document.getElementById('notiList'); if (!el) return;
    el.addEventListener('click', function(e){
      var t = e.target;
      while (t && t !== el && !(t.className && String(t.className).indexOf('noti-item') >= 0)) t = t.parentNode;
      if (!t || t === el) return;
      gotoNoti(NOTI.list[parseInt(t.getAttribute('data-i'), 10)]);
    });
  }
  function loadAcc(){
    if (!MY.u) return;
    fetch(ACC_API + '?u=' + encodeURIComponent(MY.u), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.ok){ if (d.n) MY.n = d.n; if (typeof d.a === 'string' && d.a !== '') MY.a = d.a; saveLocal(); } })
      .catch(function(){}).then(updateAccChip);
  }
  function openAcc(){ document.getElementById('accNick').value = MY.n || ''; renderAvGrid(); renderNoti(); document.getElementById('accMask').classList.add('show'); lockScroll(true); markNotiRead(); }
  function closeAcc(){ document.getElementById('accMask').classList.remove('show'); lockScroll(false); }
  function renderAvGrid(){
    var el = document.getElementById('accGrid'); if (!el) return;
    var cur = avatarIdx(MY.a), h = '';
    for (var i = 0; i < AVATARS.length; i++){ h += '<span class="av' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' + AVATARS[i] + '</span>'; }
    el.innerHTML = h;
  }
  function saveAcc(){
    var n = (document.getElementById('accNick').value || '').trim().slice(0, 16);
    if (!n){ toast('请先填个昵称'); return; }
    var prevN = MY.n;
    MY.n = n;
    document.getElementById('accSave').disabled = true;
    var au = ACC_API + '?w=1&u=' + encodeURIComponent(MY.u) + '&n=' + encodeURIComponent(MY.n) + '&a=' + encodeURIComponent(String(avatarIdx(MY.a)));
    fetch(au, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ document.getElementById('accSave').disabled = false;
        if (d && d.ok){ saveLocal(); updateAccChip(); closeAcc(); } else { MY.n = prevN; toast((d && d.msg) || '保存失败'); } })
      .catch(function(e){ document.getElementById('accSave').disabled = false; try { console.log('saveAcc fail', e); } catch(_){} toast('保存失败，请检查网络后重试'); });
  }

  /* ============ 段评 ============ */
  function pcKey(vi, ci){ return vi + '-' + ci; }
  function fetchPc(vi, ci){
    var k = pcKey(vi, ci);
    return fetch(PC_API + '?f=' + encodeURIComponent(FILES[vi]) + '&c=' + ci, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ var list = (d && d.ok && d.list) ? d.list : []; pcCache[k] = list; return list; })
      .catch(function(){ pcCache[k] = pcCache[k] || []; return pcCache[k]; });
  }
  function pcCounts(list){ var m = {}; for (var i = 0; i < list.length; i++){ var p = list[i].p | 0; m[p] = (m[p] || 0) + 1; } return m; }
  function applyBadges(){
    var f = FLAT[curIdx]; if (!f) return;
    var list = pcCache[pcKey(f.vi, f.ci)] || [];
    var m = pcCounts(list);
    var ps = document.getElementById('readerContent').querySelectorAll('p');
    for (var i = 0; i < ps.length; i++){
      var p = parseInt(ps[i].getAttribute('data-p'), 10);
      var b = ps[i].querySelector('.pcnt');
      if (!b) continue;
      if (m[p]){ b.textContent = '💬 ' + m[p]; b.style.opacity = '.95'; }
      else { b.textContent = '评论'; b.style.opacity = '.3'; }
    }
  }
  function openPc(pIdx){
    var f = FLAT[curIdx]; if (!f) return;
    pcCur = { vi: f.vi, ci: f.ci, p: pIdx };
    pcReplyTo = '';
    var paras = NOVEL[f.vi].chapters[f.ci].paras;
    document.getElementById('pcQuote').textContent = (paras[pIdx] || '').slice(0, 90);
    document.getElementById('pcMask').classList.add('show'); lockScroll(true);
    setReplyHint();
    renderPcList();
  }
  function closePc(){ document.getElementById('pcMask').classList.remove('show'); lockScroll(false); }
  function fmtTime(t){
    var d = new Date(t); function z(n){ return n < 10 ? '0' + n : '' + n; }
    return (d.getMonth()+1) + '-' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function setReplyHint(){
    var el = document.getElementById('pcReplyHint'); if (!el) return;
    if (!pcReplyTo){ el.style.display = 'none'; el.innerHTML = ''; return; }
    var list = pcCache[pcKey(pcCur.vi, pcCur.ci)] || [], t = null;
    for (var i = 0; i < list.length; i++){ if (list[i].id === pcReplyTo) t = list[i]; }
    el.style.display = 'block';
    el.innerHTML = '回复 @' + esc((t && t.n) || '读者') + ' · <span id="pcReplyCancel">取消</span>';
    var c = document.getElementById('pcReplyCancel');
    if (c) c.addEventListener('click', function(){ pcReplyTo = ''; setReplyHint(); });
  }
  function pcItemHtml(c, replies, depth){
    var likes = c.likes || [], liked = false;
    for (var i = 0; i < likes.length; i++){ if (likes[i] === MY.u) liked = true; }
    var h = '<div class="pc-item' + (depth ? ' pc-reply' : '') + '">';
    h += '<div class="pc-av" style="border-color:' + ringOf(c) + '">' + avatarOf(c) + '</div><div class="pc-body">';
    h += '<div class="who">' + esc(c.n || '读者') + (liked ? ' <span class="pc-me">我</span>' : '') + '</div>';
    h += '<div class="txt">' + esc(c.x || '') + '</div>';
    h += '<div class="pc-act"><span class="pc-like' + (liked ? ' on' : '') + '" data-id="' + esc(c.id||'') + '">👍 ' + (likes.length || '') + '</span>';
    h += '<span class="pc-re" data-id="' + esc(c.id||'') + '">回复</span>';
    if (c.uid === MY.u) { h += '<span class="pc-del" data-id="' + esc(c.id||'') + '">删除</span>'; }
    h += '<span class="tm">' + fmtTime(c.t||0) + '</span></div>';
    for (var j = 0; j < (replies||[]).length; j++){ h += pcItemHtml(replies[j], [], depth + 1); }
    h += '</div></div>';
    return h;
  }
  function renderPcList(){
    if (!pcCur) return;
    var list = (pcCache[pcKey(pcCur.vi, pcCur.ci)] || []).filter(function(c){ return (c.p | 0) === pcCur.p; });
    var el = document.getElementById('pcList');
    if (!list.length){ el.innerHTML = '<div class="pc-empty">这一段还没人评，来说两句</div>'; return; }
    var byId = {}, byParent = {}, tops = [];
    for (var i = 0; i < list.length; i++){ byId[list[i].id] = list[i]; }
    for (var i = 0; i < list.length; i++){ var c = list[i]; if (c.parent && byId[c.parent]){ (byParent[c.parent] = byParent[c.parent] || []).push(c); } else { tops.push(c); } }
    tops.sort(function(a,b){ return (a.t||0) - (b.t||0); });
    var h = '';
    for (var i = 0; i < tops.length; i++){ h += pcItemHtml(tops[i], byParent[tops[i].id] || [], 0); }
    el.innerHTML = h;
  }
  function toggleLike(id){
    if (!pcCur) return;
    var list = pcCache[pcKey(pcCur.vi, pcCur.ci)] || [], c = null;
    for (var i = 0; i < list.length; i++){ if (list[i].id === id) c = list[i]; }
    if (!c) return;
    var likes = c.likes = c.likes || [];
    var k = likes.indexOf(MY.u); if (k >= 0) likes.splice(k, 1); else likes.push(MY.u);
    renderPcList();
    var lu = PC_API + '/like?w=1&f=' + encodeURIComponent(FILES[pcCur.vi]) + '&c=' + pcCur.ci + '&id=' + encodeURIComponent(id) + '&uid=' + encodeURIComponent(MY.u);
    fetch(lu, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.ok && d.likes){ c.likes = d.likes; renderPcList(); } })
      .catch(function(){});
  }
  function pcKillSet(list, id){
    var kill = {}; kill[id] = 1; var ch = true;
    while (ch){ ch = false;
      for (var i = 0; i < list.length; i++){ var it = list[i]; if (it && it.parent && kill[it.parent] && !kill[it.id]){ kill[it.id] = 1; ch = true; } }
    }
    return kill;
  }
  function deletePc(id){
    if (!pcCur) return;
    var k = pcKey(pcCur.vi, pcCur.ci);
    var list = pcCache[k] || [];
    var kill = pcKillSet(list, id);
    var u = PC_API + '/del?w=1&f=' + encodeURIComponent(FILES[pcCur.vi]) + '&c=' + pcCur.ci + '&id=' + encodeURIComponent(id) + '&uid=' + encodeURIComponent(MY.u);
    fetch(u, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok){
          pcCache[k] = list.filter(function(x){ return !(x && kill[x.id]); });
          renderPcList(); applyBadges(); toast('已删除');
        } else { toast((d && d.msg) || '删除失败'); }
      })
      .catch(function(){ toast('删除失败，请检查网络后重试'); });
  }
  function sendPc(){
    if (!pcCur) return;
    var inp = document.getElementById('pcText');
    var x = (inp.value || '').trim();
    if (!x) return;
    if (x.length > 200) x = x.slice(0, 200);
    if (!MY.n) MY.n = displayName();
    inp.disabled = true;
    var payload = { f: FILES[pcCur.vi], c: pcCur.ci, p: pcCur.p, x: x, n: MY.n, a: String(avatarIdx(MY.a)), uid: MY.u };
    if (pcReplyTo) payload.parent = pcReplyTo;
    var qs = 'w=1&f=' + encodeURIComponent(payload.f) + '&c=' + payload.c + '&p=' + payload.p + '&x=' + encodeURIComponent(payload.x) + '&uid=' + encodeURIComponent(payload.uid) + '&n=' + encodeURIComponent(payload.n) + '&a=' + encodeURIComponent(payload.a);
    if (payload.parent) qs += '&parent=' + encodeURIComponent(payload.parent);
    fetch(PC_API + '?' + qs, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        inp.disabled = false;
        if (d && d.ok){
          var k = pcKey(pcCur.vi, pcCur.ci);
          var arr = pcCache[k] || (pcCache[k] = []);
          arr.push({ id: d.id || ('m' + Date.now()), p: pcCur.p, t: Date.now(), x: x, uid: MY.u, n: MY.n, a: String(avatarIdx(MY.a)), likes: [], parent: pcReplyTo || '' });
          inp.value = ''; pcReplyTo = ''; setReplyHint(); saveLocal();
          renderPcList(); applyBadges();
          return;
        }
        toast((d && d.msg) || (d && d.err) || '发送失败');
      })
      .catch(function(e){ inp.disabled = false; try { console.log('sendPc fail', e); } catch(_){} toast('发送失败，请检查网络后重试'); });
  }
  document.getElementById('pcClose').addEventListener('click', closePc);
  document.getElementById('pcMask').addEventListener('click', function(e){ if (e.target === this) closePc(); });
  document.getElementById('pcSend').addEventListener('click', sendPc);
  document.getElementById('pcText').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendPc(); });
  document.getElementById('pcList').addEventListener('click', function(e){
    var t = e.target; if (!t || !t.className) return;
    var cl = String(t.className);
    if (cl.indexOf('pc-like') >= 0){ toggleLike(t.getAttribute('data-id')); }
    else if (cl.indexOf('pc-del') >= 0){
      var did = t.getAttribute('data-id');
      if (pcDelArm === did){ if (pcDelTimer) clearTimeout(pcDelTimer); pcDelArm = ''; deletePc(did); }
      else {
        pcDelArm = did;
        t.textContent = '确认删除'; t.className = cl + ' arm';
        if (pcDelTimer) clearTimeout(pcDelTimer);
        pcDelTimer = setTimeout(function(){ pcDelArm = ''; renderPcList(); }, 3000);
      }
    }
    else if (cl.indexOf('pc-re') >= 0){ pcReplyTo = t.getAttribute('data-id'); setReplyHint(); var i = document.getElementById('pcText'); if (i) i.focus(); }
  });
  document.getElementById('accChip').addEventListener('click', openAcc);
  document.getElementById('accClose').addEventListener('click', closeAcc);
  document.getElementById('accMask').addEventListener('click', function(e){ if (e.target === this) closeAcc(); });
  document.getElementById('accSave').addEventListener('click', saveAcc);
  document.getElementById('accGrid').addEventListener('click', function(e){
    var t = e.target; if (t && t.className && String(t.className).indexOf('av') >= 0){ MY.a = t.getAttribute('data-i'); renderAvGrid(); }
  });
  initIdentity(); updateAccChip(); loadAcc(); bindNotiList(); loadNoti(); setInterval(loadNoti, 60000);

})();
</script>
