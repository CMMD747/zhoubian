<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>长篇小说 · 小源</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif; background:#1e1c1a; color:#c9c2b4; line-height:1.9; padding:28px 20px 60px; max-width:640px; margin:0 auto; }
  h1 { text-align:center; font-size:24px; color:#e8e0d2; letter-spacing:8px; margin:34px 0 10px; font-weight:600; }
  .subtitle { text-align:center; color:#8a7d6a; font-size:13px; letter-spacing:2px; margin-bottom:28px; border-bottom:1px solid #3a352f; padding-bottom:22px; }
  .intro { border-left:3px solid #a8906c; padding:12px 16px; margin:6px 12px 26px; color:#b3a48e; font-size:15px; background:rgba(168,144,108,0.06); line-height:1.8; }
  h2 { text-align:center; font-size:18px; color:#a8906c; letter-spacing:4px; margin:52px 0 20px; font-weight:600; }
  h3 { text-align:center; font-size:16px; color:#c9b896; letter-spacing:3px; margin:36px 0 16px; font-weight:600; }
  p { text-indent:2em; margin-bottom:14px; font-size:16px; text-align:justify; }
  .status { text-align:center; color:#7d7160; font-size:13px; letter-spacing:1px; margin:18px 0 8px; }
  .contact { text-align:center; margin-top:52px; padding-top:22px; border-top:1px solid #3a352f; }
  .contact p { text-indent:0; margin-bottom:6px; color:#a8906c; font-size:15px; letter-spacing:3px; }
  .contact a { color:#c9a86a; text-decoration:none; border-bottom:1px dashed #a8906c; }
  .end { text-align:center; color:#8a7d6a; font-size:14px; margin-top:46px; letter-spacing:8px; }
</style>
</head>
<body>
<h1>小源</h1>
<div class="subtitle">长篇小说 · 回忆录体（1885—1980）</div>
<div class="intro">《小源》是一部回忆录体长篇小说。主人公小源，生于光绪十一年（1885年）八月初二，河南扶沟县刘家村人，卒于1980年腊月二十三，享年九十五岁。全书以第一人称，从出生写到临终，横跨晚清、民国、抗战与新中国。记的是一块土地、几亩庄稼、一家人的吃饭穿衣，和一个农民一辈子的盼与等。</div>
<div id="status" class="status">正在从云端加载正文…</div>
<div id="novel"></div>
<div class="contact">
  <p>联系我们</p>
  <p>作者 QQ：<a href="mqq://card/show_pslcard?src_type=internal&version=1&uin=445256409">445256409</a></p>
</div>
<div class="end">全书完</div>
<script>
(function(){
  var BASE = 'https://cmmd747.github.io/zhoubian/novel/';
  var FILES = ['楔子','第一卷','第二卷','第三卷','第四卷','第五卷','第六卷','第七卷','第八卷','尾声'];
  var PREFIX = 'novel_xiaoyuan_v1_';
  var novelEl = document.getElementById('novel');
  var statusEl = document.getElementById('status');

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'"'); }

  function renderText(text){
    var lines = text.split(/\r?\n/), html = '';
    for (var i = 0; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;
      if (i === 0){ html += '<h2>' + esc(line) + '</h2>'; }
      else if (/^第[一二三四五六七八九十百零\d]+章/.test(line)){ html += '<h3>' + esc(line) + '</h3>'; }
      else { html += '<p>' + esc(line) + '</p>'; }
    }
    return html;
  }

  function fetchT(url, ms){
    return new Promise(function(res, rej){
      var done = false;
      var t = setTimeout(function(){ if(!done){ done = true; rej(new Error('timeout')); } }, ms);
      fetch(url, { cache: 'no-store' }).then(
        function(r){ if(!done){ done = true; clearTimeout(t); res(r); } },
        function(e){ if(!done){ done = true; clearTimeout(t); rej(e); } }
      );
    });
  }

  function loadOne(name){
    return fetchT(BASE + encodeURIComponent(name) + '.txt', 10000)
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(t){
        try { localStorage.setItem(PREFIX + name, t); } catch(e){}
        return { name: name, text: t, fromCache: false };
      })
      .catch(function(){
        var c = null;
        try { c = localStorage.getItem(PREFIX + name); } catch(e){}
        if (c) return { name: name, text: c, fromCache: true };
        return null;
      });
  }

  function renderAll(files){
    var html = '', any = false;
    for (var i = 0; i < files.length; i++){
      if (files[i].fromCache) any = true;
      html += renderText(files[i].text);
    }
    novelEl.innerHTML = html;
    statusEl.textContent = any ? '正文来自本地缓存（离线模式）' : '正文来自云端';
  }

  var jobs = FILES.map(loadOne);
  Promise.all(jobs).then(function(results){
    var ok = results.filter(function(r){ return r; });
    if (ok.length === FILES.length){ renderAll(ok); return; }
    var all = [];
    for (var i = 0; i < FILES.length; i++){
      var c = null;
      try { c = localStorage.getItem(PREFIX + FILES[i]); } catch(e){}
      if (c) all.push({ name: FILES[i], text: c, fromCache: true });
    }
    if (all.length === FILES.length){ renderAll(all); return; }
    if (ok.length){ renderAll(ok); statusEl.textContent = '部分正文云端不可用，已显示本地缓存；其余请联网后重试。'; }
    else { statusEl.textContent = '云端正文暂时不可用，且无本地缓存。请联网后打开本页。'; }
  });
})();
</script>
</body>
</html>
